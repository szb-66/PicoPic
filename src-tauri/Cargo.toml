[package]
name = "picopic"
version = "0.1.0"
description = "Offline image compression for Windows"
authors = ["PicoPic"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "picopic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tokio = { version = "1.47", features = ["sync", "rt-multi-thread"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
oxipng = { version = "10.1.1", default-features = false, features = ["parallel", "zopfli"] }
mozjpeg-rs = "0.9.2"
webp = "0.3.1"
imagequant = "4.4.1"
png = "0.18"
filetime = "0.2"
tempfile = "3.20"
thiserror = "2"
parking_lot = "0.12"
crc32fast = "1.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
assert_fs = "1.1"
